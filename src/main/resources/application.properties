spring.application.name=ProcuraX

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/supplyguard_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

management.info.env.enabled=true
info.app.name=ProcuraX
info.app.description=Enterprise Supply Chain and Supplier Risk Management System
info.app.version=1.0.0

logging.level.root=INFO
logging.level.com.company.procuraX=DEBUG

logging.file.name=logs/procuraX.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

jwt.secret=${JWT_SECRET}